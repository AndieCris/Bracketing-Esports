<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b100e">
    <title>Arena Circuit | MLBB Tournament Desk</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#overview" data-view-link="overview" aria-label="Arena Circuit home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="brand-copy"><strong>ARENA</strong><small>CIRCUIT / MLBB</small></span>
        </a>

        <div class="sidebar-label">Tournament desk</div>
        <nav class="primary-nav">
          <button class="nav-link" data-view="overview" aria-current="page" title="Overview">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="11" width="7" height="10" rx="1"/><rect x="3" y="14" width="8" height="7" rx="1"/></svg>
            <span>Overview</span>
          </button>
          <button class="nav-link" data-view="bracket" title="Bracket">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h5v5H4zM15 14h5v5h-5zM4 14h5v5H4zM9 7.5h3v9h3M9 16.5h3"/><path d="M12 7.5h3"/></svg>
            <span>Bracket</span>
          </button>
          <button class="nav-link" data-view="teams" title="Teams">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19v-1.2A4.8 4.8 0 0 1 8.3 13h1.4a4.8 4.8 0 0 1 4.8 4.8V19zM16 5.3a3 3 0 0 1 0 5.4M17 13.2a4.6 4.6 0 0 1 3.5 4.5V19h-3"/></svg>
            <span>Teams</span>
          </button>
          <button class="nav-link" data-view="matches" title="Matches">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 9h18M8 13h3M8 17h7"/></svg>
            <span>Matches</span>
          </button>
          <button class="nav-link" data-view="public" title="Public view">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.5"/></svg>
            <span>Public view</span>
          </button>
        </nav>

        <div class="sidebar-spacer"></div>
        <div class="local-status">
          <span class="status-led"></span>
          <span><strong>LOCAL SAVE</strong><small>Stored in this browser</small></span>
        </div>
        <div class="sidebar-tools">
          <button class="tool-button" data-action="export-json" title="Export backup">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 17v3h16v-3"/></svg><span>Backup</span>
          </button>
          <button class="tool-button" data-action="import-json" title="Restore backup">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 17v3h16v-3"/></svg><span>Restore</span>
          </button>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="topbar-context"><span class="live-dot"></span><span>TOURNAMENT CONTROL</span><span class="context-divider">/</span><span id="context-tournament">No active event</span></div>
          <div class="topbar-actions">
            <label class="sr-only" for="tournament-switcher">Select tournament</label>
            <select id="tournament-switcher" class="tournament-switcher" aria-label="Select tournament" hidden></select>
            <button class="button button-primary button-compact" data-action="new-tournament">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New tournament</span>
            </button>
          </div>
        </header>

        <section class="page-heading">
          <div>
            <div class="eyebrow" id="page-eyebrow">MLBB / ADMIN CONSOLE</div>
            <h1 id="page-title">Overview</h1>
            <p id="page-description">Your tournament operations, one clear view.</p>
          </div>
          <div class="heading-actions" id="heading-actions"></div>
        </section>

        <main id="app-page" class="page-content" tabindex="-1"></main>
      </div>
    </div>

    <dialog id="app-dialog" class="app-dialog" aria-labelledby="dialog-title">
      <form id="dialog-form" method="dialog">
        <div class="dialog-heading">
          <div><div class="eyebrow">ARENA CIRCUIT / EDITOR</div><h2 id="dialog-title"></h2></div>
          <button class="icon-button" type="button" data-action="close-dialog" aria-label="Close dialog" title="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="dialog-body" id="dialog-body"></div>
        <div class="dialog-footer" id="dialog-footer"></div>
      </form>
    </dialog>

    <input id="backup-file" type="file" accept="application/json,.json" hidden>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="bracket.js"></script>
    <script src="app.js"></script>
  </body>
</html>
